services:
  mariadb:
    image: mariadb:11
    container_name: projetannuel_mariadb_prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-projet}
      MYSQL_USER: ${MYSQL_USER:-projet_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-projet_password}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mariadb_data_prod:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  go:
    image: ${GHCR_NAMESPACE:-ghcr.io/votre-organisation-ou-utilisateur}/projetannuel-go:${APP_VERSION:-1.0.0}
    container_name: projetannuel_go_prod
    restart: unless-stopped
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-projet}
      DB_USER: ${MYSQL_USER:-projet_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-projet_password}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID_MOIS: ${STRIPE_PRICE_ID_MOIS:-}
      STRIPE_PRICE_ID_AN: ${STRIPE_PRICE_ID_AN:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      ONESIGNAL_APP_ID: ${ONESIGNAL_APP_ID:-}
      ONESIGNAL_REST_API_KEY: ${ONESIGNAL_REST_API_KEY:-}
    ports:
      - "${API_PORT:-9000}:9000"
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - backend

  php:
    image: ${GHCR_NAMESPACE:-ghcr.io/votre-organisation-ou-utilisateur}/projetannuel-php:${APP_VERSION:-1.0.0}
    container_name: projetannuel_php_prod
    restart: unless-stopped
    environment:
      API_URL: ${PUBLIC_API_URL:-http://localhost:9000}
      ONESIGNAL_APP_ID: ${ONESIGNAL_APP_ID:-}
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - uploads_data:/var/www/html/upload
      - ml_artifacts:/var/www/html/ml
    depends_on:
      mariadb:
        condition: service_healthy
      go:
        condition: service_started
    networks:
      - backend
      - frontend

  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: projetannuel_libretranslate_prod
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: ${LT_LOAD_ONLY:-en,fr,ru,es,de,it,pt,nl,pl,uk}
    ports:
      - "${LIBRETRANSLATE_PORT:-5000}:5000"
    networks:
      - backend

  ml_trainer:
    image: ${GHCR_NAMESPACE:-ghcr.io/votre-organisation-ou-utilisateur}/projetannuel-ml:${APP_VERSION:-1.0.0}
    container_name: projetannuel_ml_trainer_prod
    restart: "no"
    volumes:
      - ml_artifacts:/app/php/ml
      - ./php/dataset.csv:/app/php/dataset.csv:ro
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
  frontend:

volumes:
  mariadb_data_prod:
  uploads_data:
  ml_artifacts: