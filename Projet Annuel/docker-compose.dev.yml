services:
  mariadb:
    image: mariadb:11
    container_name: projetannuel_mariadb_dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-projet}
      MYSQL_USER: ${MYSQL_USER:-projet_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-projet_password}
    ports:
      - "${DB_EXPOSE_PORT:-3306}:3306"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mariadb_data_dev:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  go:
    build:
      context: ./go
      dockerfile: dockerfile
      target: development
    container_name: projetannuel_go_dev
    restart: unless-stopped
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-projet}
      DB_USER: ${MYSQL_USER:-projet_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-projet_password}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID_MOIS: ${STRIPE_PRICE_ID_MOIS:-}
      STRIPE_PRICE_ID_AN: ${STRIPE_PRICE_ID_AN:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      ONESIGNAL_APP_ID: ${ONESIGNAL_APP_ID:-}
      ONESIGNAL_REST_API_KEY: ${ONESIGNAL_REST_API_KEY:-}
    ports:
      - "${API_PORT:-9000}:9000"
    volumes:
      - ./go:/app
    depends_on:
      mariadb:
        condition: service_healthy

  php:
    build:
      context: ./php
      dockerfile: dockerfile
      target: development
    container_name: projetannuel_php_dev
    restart: unless-stopped
    environment:
      API_URL: ${PUBLIC_API_URL:-http://localhost:9000}
      ONESIGNAL_APP_ID: ${ONESIGNAL_APP_ID:-}
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./php:/var/www/html
      - ./upload:/var/www/html/upload
    depends_on:
      mariadb:
        condition: service_healthy
      go:
        condition: service_started

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: projetannuel_phpmyadmin_dev
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      PMA_DATABASE: ${MYSQL_DATABASE:-projet}
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    depends_on:
      mariadb:
        condition: service_healthy

  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: projetannuel_libretranslate_dev
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: ${LT_LOAD_ONLY:-en,fr,ru,es,de,it,pt,nl,pl,uk}
    ports:
      - "${LIBRETRANSLATE_PORT:-5000}:5000"

  ml_trainer:
    build:
      context: ./ml
      dockerfile: Dockerfile
      target: development
    container_name: projetannuel_ml_trainer_dev
    restart: "no"
    volumes:
      - ./php:/app/php
      - ./ml:/app/ml
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb_data_dev: